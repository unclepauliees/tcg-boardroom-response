<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@300;400&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;}
  body{
    width:1200px; height:630px; overflow:hidden; position:relative;
    background:
      repeating-linear-gradient(90deg, transparent, transparent 79px, rgba(196,154,60,.08) 80px),
      repeating-linear-gradient(0deg, transparent, transparent 79px, rgba(196,154,60,.08) 80px),
      radial-gradient(ellipse at 25% 20%, rgba(125,139,109,.18), transparent 55%),
      radial-gradient(ellipse at 78% 85%, rgba(196,154,60,.16), transparent 55%),
      #1C1C1A;
    font-family:"Archivo", sans-serif;
  }
  .plate{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:80px 90px;}
  .eyebrow{font-family:"Space Mono", monospace;font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:#BAB6AB;margin-bottom:28px;}
  .eyebrow b{color:#C49A3C;}
  .headline{font-family:"Archivo Black", sans-serif;font-weight:900;font-size:150px;letter-spacing:-.04em;line-height:.92;color:#ECEAE3;margin:0;}
  .sub{margin-top:36px;font-family:"Archivo", sans-serif;font-weight:300;font-size:30px;color:#908D83;letter-spacing:-.01em;}
  .rule{margin-top:36px;display:flex;align-items:center;gap:12px;}
  .rule .line{width:60px;height:2px;background:#C49A3C;}
  .rule .dot{width:8px;height:8px;border-radius:50%;background:#C49A3C;}
  .badge{position:absolute;top:80px;right:90px;display:flex;align-items:center;gap:14px;font-family:"Space Mono",monospace;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#ECEAE3;opacity:.8;}
  .ring{width:30px;height:30px;border-radius:50%;border:2px solid #ECEAE3;}
</style>
</head>
<body>
  <div class="badge"><span class="ring"></span><span>The Concrete Group &middot; Issuing Agency</span></div>
  <div class="plate">
    <p class="eyebrow"><b>A Response</b> to the Boardroom RFP</p>
    <h1 class="headline">BOARDROOM</h1>
    <p class="sub">Prepared by The Concrete Group &middot; Confidential</p>
    <div class="rule"><span class="line"></span><span class="dot"></span></div>
  </div>
</body>
</html>
